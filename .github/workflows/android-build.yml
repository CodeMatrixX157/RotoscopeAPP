name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # NOTE: no gradlew wrapper is committed yet (the wrapper jar is a binary that must be
      # downloaded from Gradle's servers, which isn't possible from this offline dev sandbox).
      # setup-gradle above provides a working `gradle` on the runner instead, so this builds fine
      # as-is. Recommended follow-up: once you're on a machine with internet, run
      # `gradle wrapper --gradle-version 8.5` in the project root and commit gradlew +
      # gradlew.bat + gradle/wrapper/* — that pins the exact Gradle version for reproducible builds.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rotoscope-debug-apk
          path: app/build/outputs/apk/debug/*.apk
